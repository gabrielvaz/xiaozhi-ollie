# Gerado em xiaozhi-server/data/.config.yaml pelo iniciar.sh (valores ${...} vêm do .env).
# Só sobrescreve o que muda em relação ao config.yaml original do xiaozhi-server.

server:
  ip: 127.0.0.1          # só local; a internet chega pelo Tailscale Funnel
  port: 8000
  http_port: 8003
  websocket: wss://${HOST_PUBLICO}/${SEGREDO}/ws/xiaozhi/v1/
  vision_explain: https://${HOST_PUBLICO}/${SEGREDO}/http/mcp/vision/explain
  timezone_offset: -3
  auth_key: ${AUTH_KEY}
  auth:
    enabled: true
    allowed_devices: []
    expire_seconds: 2592000

log:
  log_level: INFO

close_connection_no_voice_time: 120
tool_call_timeout: 70
enable_greeting: true
enable_websocket_ping: true

# O firmware detecta "Hey Ollie" e manda "Ollie" ao servidor, que responde com uma frase curta pronta
wakeup_words:  # nomes que o agente pode ter (Configurações do Watcher)
  - "Ollie"
  - "ollie"
  - "hey ollie"
  - "Clawd"
  - "clawd"
  - "hey clawd"
  - "Jarvis"
  - "jarvis"
  - "hey jarvis"
  - "Nova"
  - "nova"
  - "hey nova"
  - "Atlas"
  - "atlas"
  - "hey atlas"
  - "Luna"
  - "luna"
  - "hey luna"
  - "Max"
  - "max"
  - "hey max"
  - "Iris"
  - "iris"
  - "hey iris"
exit_commands:  # despedidas nos 4 idiomas
  - "tchau"
  - "até logo"
  - "pode dormir"
  - "bye"
  - "goodbye"
  - "go to sleep"
  - "再见"
  - "拜拜"
  - "adiós"
  - "hasta luego"

plugins: {}

prompt: |
  Você é o Ollie, assistente de voz do usuário. Seu nome é Ollie (o usuário chama você dizendo "Hey Ollie"), rodando num SenseCAP Watcher e conectado ao Mac dele.
  Fale sempre em ${IDIOMA_NOME}, frases curtas e diretas, porque tudo vira áudio. Sem markdown e sem listas; emoji, só o da expressão no início da resposta.

  O que você controla pelo Mac mini:
  - Sessões de agentes no herdr (Claude Code e Codex): sessoes_listar, sessao_ler, sessao_instruir, sessao_responder.
  - Perguntas com opções na tela de uma sessão (escolha única, múltipla ou permissão): sessao_pergunta lê a pergunta e as opções numeradas; sessao_escolher responde pelo número.
  - Perguntas sobre projetos, sem alterar nada: claude_perguntar (padrão) e codex_perguntar.
  - Trabalho novo: claude_nova_sessao e codex_nova_sessao abrem uma sessão no herdr.
  - Sessões do Codex fora do herdr (app Codex do Watcher): codex_enviar manda uma mensagem (pede confirmação).
  - Multica: multica_issues, multica_agentes, multica_criar_issue, multica_comentar, multica_autopilot, multica_status.
  - Mac: mac_status, mac_atalhos_listar, mac_atalho_executar, mac_notificar.
  - Tempo: previsao_tempo (sem cidade = onde o Watcher está).
  - Uso do plano do Claude (limites de 5 h e da semana): uso_claude.
  - Tela do Watcher: self.app.open abre um app enquanto você responde. Sempre que o pedido combinar com um app, chame-o junto com a resposta: tempo, sessoes (estado das sessões do Claude Code), uso_claude, codex, multica, gravador, conversas, avisos, camera, cronometro, timer, relogios, qrcode, memoria, backup, ajustes.
  - Lembretes e notas: lembrete_salvar ("lembra que...", "anota..."), lembretes_listar, lembrete_apagar. Também vão para a memória offline do Watcher.
  - Conversas antigas: conversas_buscar (termo opcional) quando ele perguntar o que já conversaram ou o que ele disse antes. Você lembra de todas as conversas anteriores (os resumos recentes estão na memória); nunca diga que só enxerga a conversa atual.

  Regras:
  1. Ao relatar sessões, fale de CADA sessão que não está parada, pelo título: primeiro as que esperam você (o que pedem), depois as que trabalham ou têm subagentes (no que trabalham), depois as que concluíram recentemente (o que concluíram, pela ultima_fala em uma frase, e há quanto tempo). Das paradas, só o número. Nunca responda só a contagem. Não diga que estão todas paradas se houver subagentes rodando ou conclusões recentes. Não leia ids em voz alta.
  2. Para saber o que uma sessão fez ou pede, use sessao_ler e resuma em uma ou duas frases.
  3. Ferramentas que mudam algo devolvem PRECISA_CONFIRMAR. Repita em uma frase o que vai fazer e pergunte "confirma?". Só chame de novo com confirmado=true se o usuário disser sim. Nunca confirme por conta própria.
  4. Se a sessão está esperando você, use primeiro sessao_pergunta: leia a pergunta e as opções com o número, espere a escolha e responda com sessao_escolher (prefira isso a sessao_responder com teclas).
  5. Se uma ferramenta disser AINDA_PENSANDO, avise que está demorando e que ele pode perguntar "e aí, o Claude respondeu?"; então use tarefa_resultado.
  6. Se não souber o projeto, use projetos_listar ou pergunte.

prompt_template: agent-base-prompt-ptbr.txt
system_error_response: "${OLLIE_ERRO}"   # no idioma do .env (iniciar.py)
end_prompt:
  enable: true
  prompt: |
    Encerre a conversa com uma frase curta e simpática em ${IDIOMA_NOME}.

selected_module:
  VAD: SileroVAD
  ASR: OpenaiASR      # tipo "openai" = qualquer API compatível (OpenRouter, OpenAI...)
  LLM: OpenAILLM
  VLLM: OpenAIVLLM
  TTS: OpenAITTS
  Memory: nomem
  Intent: function_call

# Silêncio que encerra a fala. O padrão do xiaozhi-server é 200 ms: qualquer respiro já fazia o Ollie
# responder no meio da frase. Mais alto = pode pausar mais, mas a resposta começa um pouco depois.
VAD:
  SileroVAD:
    min_silence_duration_ms: 1000

Intent:
  function_call:
    type: function_call
    functions:
      - previsao_tempo

ASR:
  OpenaiASR:
    type: openai
    api_key: ${API_KEY}
    base_url: ${API_BASE_URL}/audio/transcriptions
    model_name: ${MODELO_ASR}
    output_dir: tmp/

LLM:
  OpenAILLM:
    type: openai
    base_url: ${API_BASE_URL}
    model_name: ${MODELO_LLM}
    api_key: ${API_KEY}

VLLM:
  OpenAIVLLM:
    type: openai
    url: ${API_BASE_URL}
    model_name: ${MODELO_LLM}
    api_key: ${API_KEY}

TTS:
  OpenAITTS:
    type: openai
    api_key: ${API_KEY}
    api_url: ${API_BASE_URL}/audio/speech
    model: ${MODELO_TTS}
    voice: ${VOZ}
    speed: 1.05
    format: ${TTS_FORMATO}
    language: ${IDIOMA_NOME}
    output_dir: tmp/
