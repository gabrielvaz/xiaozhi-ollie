name: Ollie
options:
  bundleIdPrefix: com.example.olliewatch  # os IDs reais vêm de OLLIE_BUNDLE_PREFIX (Config/)
  deploymentTarget:
    watchOS: "26.0"
    iOS: "18.0"
  developmentLanguage: en
  knownRegions: [en, pt-BR, Base]
  createIntermediateGroups: true

# Team ID, bundle IDs e relay: Config/Ollie.xcconfig (exemplo) + Config/Local.xcconfig (os seus, fora do git)
configFiles:
  Debug: Config/Ollie.xcconfig
  Release: Config/Ollie.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: $(OLLIE_TEAM_ID)
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  # Container vazio que a App Store exige para um app só de relógio.
  Ollie:
    type: application.watchapp2-container
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OLLIE_BUNDLE_PREFIX)
        PRODUCT_NAME: Ollie
        INFOPLIST_KEY_CFBundleDisplayName: Ollie
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: OllieWatch

  OllieWatch:
    type: application
    platform: watchOS
    sources:
      - path: Ollie
    info:
      path: Ollie/Info.plist
      properties:
        CFBundleDisplayName: Ollie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        OllieRelayURL: $(OLLIE_RELAY_URL)
        OllieKeychainGroup: $(AppIdentifierPrefix)$(OLLIE_BUNDLE_PREFIX).shared
        OllieKeychainService: $(OLLIE_BUNDLE_PREFIX)
        WKWatchOnly: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
    entitlements:
      path: Ollie/Ollie.entitlements
      properties:
        aps-environment: development
        keychain-access-groups: ["$(AppIdentifierPrefix)$(OLLIE_BUNDLE_PREFIX).shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OLLIE_BUNDLE_PREFIX).watchkitapp
        PRODUCT_NAME: Ollie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
    dependencies:
      - target: OllieWidgets

  OllieWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: OllieWidgets
      - path: Ollie/Model/Shared.swift
      - path: Ollie/Model/RelayModels.swift
      - path: Ollie/Model/RelayClient.swift
      - path: Ollie/Model/Keychain.swift
    info:
      path: OllieWidgets/Info.plist
      properties:
        CFBundleDisplayName: Ollie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OllieRelayURL: $(OLLIE_RELAY_URL)
        OllieKeychainGroup: $(AppIdentifierPrefix)$(OLLIE_BUNDLE_PREFIX).shared
        OllieKeychainService: $(OLLIE_BUNDLE_PREFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: OllieWidgets/OllieWidgets.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)$(OLLIE_BUNDLE_PREFIX).shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OLLIE_BUNDLE_PREFIX).watchkitapp.widgets
        PRODUCT_NAME: OllieWidgets
        SKIP_INSTALL: YES

  OllieTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [OllieTests]
    dependencies:
      - target: OllieWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OLLIE_BUNDLE_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ollie.app/Ollie

schemes:
  Ollie:
    build:
      targets:
        Ollie: all
        OllieWatch: all
    archive:
      config: Release
  OllieWatch:
    build:
      targets:
        OllieWatch: all
    test:
      targets: [OllieTests]
